<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Tennis Counter" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Tennis Counter" />
    <title>Punktezähler-Match</title>
    <link rel="icon" href="/images/image.png" type="image/x-icon" />
    <link rel="stylesheet" href="/index_handy.css" />
  </head>
  <body>
    <h1>offline seite</h1>

    <h1>Neue Partie</h1>
    <label for="player1" class="big-text">Spieler1</label><br />
    <input
      type="text"
      id="player1"
      class="inputs"
      autocomplete="off"
      list="favoritNames"
    /><br />
    <label for="player2" class="big-text">Spieler2</label><br />
    <input
      type="text"
      id="player2"
      class="inputs"
      autocomplete="off"
      list="favoritNames"
    /><br />
    <datalist id="favoritNames"></datalist>
    <label for="tournament" class="big-text">Turnier(optional)</label><br />
    <input
      type="text"
      id="tournament"
      class="inputs"
      autocomplete="off"
      list="tournaments"
    /><br />
    <datalist id="tournaments"></datalist>
    <label for="set" class="big-text">Satz</label><br />
    <select id="set" class="inputs">
      <option value="6">Bis 6</option>
      <option value="4">Bis 4 4-4 thiebreak</option>
      <option value="3-3">Bis 4 3-3 thiebreak</option></select
    ><br />
    <label for="max_sets" class="big-text">Sätze</label><br />
    <select id="max_sets" class="inputs">
      <option value="3">3 Sätze</option>
      <option value="5">5 Sätze</option></select
    ><br />
    <label for="3rd_set" class="big-text">letzter Satz</label><br />
    <select id="3rd_set" class="inputs">
      <option value="10">Championsthiebreak bis 10</option>
      <option value="7">Championsthiebreak bis 7</option>
      <option value="set">Normaler Satz</option></select
    ><br />
    <label for="advantage" class="big-text">Mit vorteil?</label><br />
    <select id="advantage" class="inputs">
      <option value="true">ja</option>
      <option value="false">nein</option></select
    ><br />
    <label for="beginner" class="big-text">Wer fängt an?</label><br />
    <select id="beginner" class="inputs">
      <option value="player1">Spieler1</option>
      <option value="player2">Spieler2</option></select
    ><br />
    <label for="aloowposition" class="big-text">standort</label>
    <input type="checkbox" id="aloowposition" class="check" checked />
    <button id="start_match" onclick="start_match()" class="main-button">
      partie starten
    </button>

    <script src="/service-worker-register.js"></script>
  </body>
</html>
