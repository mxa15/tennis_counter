<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Punktezähler-Login</title>
    <link rel="icon" href="/public/image.png" type="image/x-icon" />
    <style>
      body {
        margin: 10px;
        display: grid;
        grid-template-columns: 90%;
        margin-left: 5%;
        font-family: Arial, Helvetica, sans-serif;
      }
      .pop-up {
        position: fixed;
        transform: translate(-50%, -100%);
        left: 50%;
        top: -3px;
        width: auto;
        height: auto;
        padding: 3px;
        border-radius: 7px;
        background: gray;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 17px;
        opacity: 0;
        transition:
          opacity 0.5s ease,
          top 0.5s ease;
        z-index: 1000;
      }
      .pop-up.open {
        top: 45px;
        opacity: 1;
      }
      .loader {
        position: fixed;
        display: none;
        inset: 0;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        background: white;
      }
      .loadingcircle {
        width: 20px;
        height: 20px;
      }
      .c {
        position: absolute;
        width: 12px;
        height: 12px;
        border-radius: 6px;
        background: black;
        opacity: 0;
      }
      #c1 {
        transform: translateY(-40px);
        animation: canim 1.4s linear infinite;
      }
      #c2 {
        transform: rotateZ(26deg) translateY(-40px);
        animation: canim 1.4s linear 0.1s infinite;
      }
      #c3 {
        transform: rotateZ(52deg) translateY(-40px);
        animation: canim 1.4s linear 0.2s infinite;
      }
      #c4 {
        transform: rotateZ(78deg) translateY(-40px);
        animation: canim 1.4s linear 0.3s infinite;
      }
      #c5 {
        transform: rotateZ(104deg) translateY(-40px);
        animation: canim 1.4s linear 0.4s infinite;
      }
      #c6 {
        transform: rotateZ(130deg) translateY(-40px);
        animation: canim 1.4s linear 0.5s infinite;
      }
      #c7 {
        transform: rotateZ(156deg) translateY(-40px);
        animation: canim 1.4s linear 0.6s infinite;
      }
      #c8 {
        transform: rotateZ(182deg) translateY(-40px);
        animation: canim 1.4s linear 0.7s infinite;
      }
      #c9 {
        transform: rotateZ(208deg) translateY(-40px);
        animation: canim 1.4s linear 0.8s infinite;
      }
      #c10 {
        transform: rotateZ(234deg) translateY(-40px);
        animation: canim 1.4s linear 0.9s infinite;
      }
      #c11 {
        transform: rotateZ(260deg) translateY(-40px);
        animation: canim 1.4s linear 1s infinite;
      }
      #c12 {
        transform: rotateZ(286deg) translateY(-40px);
        animation: canim 1.4s linear 1.1s infinite;
      }
      #c13 {
        transform: rotateZ(312deg) translateY(-40px);
        animation: canim 1.4s linear 1.2s infinite;
      }
      #c14 {
        transform: rotateZ(338deg) translateY(-40px);
        animation: canim 1.4s linear 1.3s infinite;
      }
      @keyframes canim {
        0% {
          opacity: 1;
        }
        60% {
          opacity: 0;
        }
        100% {
          opacity: 0;
        }
      }
      section {
        display: block;
        width: 50%;
      }
      input {
        width: 100%;
        height: 50px;
        font-size: 25px;
        border: 3px solid black;
        margin-bottom: 10px;
        transition:
          border-radius 0.4s ease,
          transform 0.4s ease,
          color 0.4s ease,
          background 0.4s ease;
        border-radius: 5px;
        transform: scale(1);
        padding: 0;
        background: white;
        color: black;
        text-align: center;
        outline: none;
        box-shadow: none;
      }
      input::placeholder {
        color: black;
        transition: color 0.2s ease;
      }
      input:focus {
        border-radius: 25px;
        transform: scale(1.1);
        background: black;
        color: white;
        outline: none;
        box-shadow: none;
      }
      input:focus::placeholder {
        color: white;
      }
      button {
        width: 70%;
        margin-left: 15%;
        height: 30px;
        border: 0;
        color: white;
        background: black;
        border-radius: 15px;
      }
      h1 {
        width: 100%;
        display: flex;
        justify-content: center;
        color: bl;
      }
      @media (min-width: 600px) {
        body {
          grid-template-columns: 50%;
          margin-left: 25%;
        }
      }
    </style>
  </head>
  <body>
    <div id="loading" class="loader">
      <div class="loadingcircle">
        <div id="c1" class="c"></div>
        <div id="c2" class="c"></div>
        <div id="c3" class="c"></div>
        <div id="c4" class="c"></div>
        <div id="c5" class="c"></div>
        <div id="c6" class="c"></div>
        <div id="c7" class="c"></div>
        <div id="c8" class="c"></div>
        <div id="c9" class="c"></div>
        <div id="c10" class="c"></div>
        <div id="c11" class="c"></div>
        <div id="c12" class="c"></div>
        <div id="c13" class="c"></div>
        <div id="c14" class="c"></div>
      </div>
    </div>
    <a href="/sign_up">sign up?</a>
    <h1 id="subtitle">Login</h1>
    <form
      onsubmit="
        login();
        return false;
      "
    >
      <input
        id="name"
        type="text"
        required
        placeholder="username"
        autocapitalize="off"
      /><br />
      <input
        id="password"
        type="password"
        required
        placeholder="password"
      /><br />
      <button type="submit">Anmelden</button>
    </form>
    <script src="/public/login.js"></script>
  </body>
</html>
