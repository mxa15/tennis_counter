<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Punktezähler-Startseite</title>
    <link
      rel="stylesheet"
      href="/public/index.css"
      media="screen and (min-width: 800px)"
    />
    <link
      rel="stylesheet"
      href="/public/index_handy.css"
      media="screen and (max-width: 800px)"
    />
    <link rel="icon" href="/public/image.png" type="image/x-icon" />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <button id="open_sidebar" , class="open_close">
        <img src="/public/sidebar.png" alt="" class="sidebarbutton" />
      </button>
      <div id="logodiv" onclick="changesection('startseite')">
        <img src="/public/image.png" alt="logo" id="logo" />
        <h1 id="title">Punktezähler</h1>
      </div>
      <a
        href="/login"
        class="profilebutton"
        id="loginbutton"
        style="display: none"
        ><img src="/public/login.png" alt="login" class="profilebutton"
      /></a>
      <button
        class="profilebutton"
        id="profilebutton"
        onclick="
          changesection('profile');
          history.pushState({}, '', '?page=profile');
        "
        style="display: none"
      >
        <img src="/public/profile.png" alt="login" class="profilebutton" />
      </button>
    </header>
    <div class="loader" id="loading">
      <div class="bar1"></div>
      <div class="bar2"></div>
      <div class="bar3"></div>
      <div class="bar4"></div>
      <div class="bar5"></div>
      <div class="bar6"></div>
      <div class="bar7"></div>
      <div class="bar8"></div>
      <div class="bar9"></div>
      <div class="bar10"></div>
      <div class="bar11"></div>
      <div class="bar12"></div>
    </div>
    <div id="under_sidebar"></div>
    <div id="sidebar">
      <button id="close_sidebar" class="open_close">
        <img src="/public/close.png" alt="" class="sidebarbutton" />
      </button>

      <button
        class="sectionselection"
        onclick="
          changesection('startseite');
          history.pushState({}, '', '?page=startseite');
        "
      >
        Startseite</button
      ><br />
      <button
        class="sectionselection"
        onclick="
          changesection('neue_partie');
          history.pushState({}, '', '?page=neue_partie');
        "
      >
        Neue Partie</button
      ><br />
      <button
        class="sectionselection"
        onclick="
          changesection('freunde');
          history.pushState({}, '', '?page=freunde');
        "
      >
        Freunde</button
      ><br />
      <button
        class="sectionselection"
        onclick="
          changesection('partien');
          history.pushState({}, '', '?page=partien');
        "
      >
        Partien</button
      ><br />
      <button
        class="sectionselection"
        id="lastselector"
        onclick="
          changesection('einstellungen');
          history.pushState({}, '', '?page=einstellungen');
        "
      >
        Einstellungen</button
      ><br />
    </div>

    <section id="startseite" class="sections">
      <h1>Startseite</h1>
      <h2>meine partien</h2>
      <div id="mymatches" class="matchdiv"></div>
      <h2>live</h2>
      <div id="livematches" class="matchdiv"></div>
      <h2>fertig</h2>
      <div id="finishedmatches" class="matchdiv"></div>
    </section>
    <section id="neue_partie" class="sections" style="display: none">
      <h1>Neue Partie</h1>
      <label for="player1">Spieler1</label><br />
      <input type="text" id="player1" list="favoritNames" /><br />
      <label for="player2">Spieler2</label><br />
      <input type="text" id="player2" list="favoritNames" /><br />
      <datalist id="favoritNames"></datalist>
      <label for="tournament">Turnier(optional)</label><br />
      <input type="text" id="tournament" list="tournaments" /><br />
      <datalist id="tournaments"></datalist>
      <label for="set">Satz</label><br />
      <select id="set">
        <option value="6">Bis 6</option>
        <option value="4">Bis 4</option></select
      ><br />
      <label for="max_sets">Sätze</label><br />
      <select id="max_sets">
        <option value="3">3 Sätze</option>
        <option value="5">5 Sätze</option></select
      ><br />
      <label for="3rd_set">3er Satz</label><br />
      <select id="3rd_set">
        <option value="10">Championsthiebreak bis 10</option>
        <option value="7">Championsthiebreak bis 7</option>
        <option value="set">Normaler Satz</option></select
      ><br />
      <label for="advantage">Mit vorteil?</label><br />
      <select id="advantage">
        <option value="true">ja</option>
        <option value="false">nein</option></select
      ><br />
      <label for="beginner">Wer fängt an?</label><br />
      <select id="beginner">
        <option value="player1">Spieler1</option>
        <option value="player2">Spieler2</option></select
      ><br />
      <label for="aloowposition">standort</label>
      <input type="checkbox" id="aloowposition" class="check" />
      <button id="start_match" onclick="start_match()">partie starten</button>
    </section>
    <section id="freunde" class="sections" style="display: none">
      <h1>Freunde</h1>
      <div id="friendoutput"></div>
      <div class="newfriend_div" onclick="open_newfrienddiv()">
        <div id="loading_newfrienddiv">
          <div class="spinner"></div>
        </div>
        <h2>Neuer Freund</h2>
        <div id="newfriend_open_div" style="display: none">
          <br />
          <search-input
            placeholder="suchen"
            inputID="newfriend_search"
          ></search-input>
          <div id="newfriend_searchoutput"></div>
        </div>
      </div>
    </section>
    <section id="partien" class="sections" style="display: none">
      <h1>Partien</h1>
      <div id="matches"></div>
    </section>
    <section id="einstellungen" class="sections" style="display: none">
      <h1>Einstellungen</h1>
      <form
        onsubmit="
          addfavoritName();
          return false;
        "
      >
        <input type="text" required placeholder="Name" id="favoritNameInput" />
        <button type="submit">hinzufügen</button>
      </form>
      <div id="favoritNameDiv"></div>
    </section>
    <section id="profile" class="sections" style="display: none">
      <h1 id="profilename">Profile</h1>
      <button id="logout" class="logout_delete">Abmelden</button>
      <button id="delete_user" class="logout_delete">Konto löschen</button>
    </section>

    <script src="/public/main.js"></script>
  </body>
</html>
