<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="rgb(153, 255, 0)" />
    <title>Punktezähler-Startseite</title>
    <link rel="stylesheet" href="/public/loader.css" />
    <link
      rel="stylesheet"
      href="/public/index.css"
      media="screen and (min-width: 800px)"
    />
    <link
      rel="stylesheet"
      href="/public/index_handy.css"
      media="screen and (max-width: 800px)"
    />
    <link rel="icon" href="/public/images/image.png" type="image/x-icon" />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="over-header"></div>
    <header>
      <div id="logodiv" onclick="changesection('startseite')">
        <img src="/public/images/image.png" alt="logo" id="logo" />
        <h1 id="title">Punktezähler</h1>
      </div>
    </header>
    <div id="loading" class="loader">
      <div class="loadingcircle">
        <div id="c1" class="c"></div>
        <div id="c2" class="c"></div>
        <div id="c3" class="c"></div>
        <div id="c4" class="c"></div>
        <div id="c5" class="c"></div>
        <div id="c6" class="c"></div>
        <div id="c7" class="c"></div>
        <div id="c8" class="c"></div>
        <div id="c9" class="c"></div>
        <div id="c10" class="c"></div>
        <div id="c11" class="c"></div>
        <div id="c12" class="c"></div>
        <div id="c13" class="c"></div>
        <div id="c14" class="c"></div>
      </div>
    </div>

    <div id="nav">
      <button
        onclick="changesection('startseite')"
        id="change_startseite"
        class="selected"
      >
        <img src="/public/images/nav/home.png" alt="" />
        <p>startseite</p>
      </button>
      <button onclick="changesection('partien')" id="change_partien">
        <img src="/public/images/nav/tennis.png" alt="" />
        <p>partien</p>
      </button>
      <button onclick="changesection('neue_partie')" id="change_neue_partie">
        <img src="/public/images/nav/plus.png" alt="" />
        <p>neu</p>
      </button>
      <button onclick="changesection('freunde')" id="change_freunde">
        <img src="/public/images/nav/users-avatar.png" alt="" />
        <p>freunde</p>
      </button>
      <button
        onclick="changesection('einstellungen')"
        id="change_einstellungen"
      >
        <img
          src="/public/images/nav/user-avatar.png"
          alt=""
          id="settings_img"
        />
        <p>einstellungen</p>
      </button>
    </div>

    <section id="startseite" class="sections">
      <h1>Startseite</h1>
      <h2 class="big-text">meine partien</h2>
      <div id="mymatches" class="matchdiv"></div>
      <h2 class="big-text">live</h2>
      <div id="livematches" class="matchdiv"></div>
      <h2 class="big-text">fertig</h2>
      <div id="finishedmatches" class="matchdiv"></div>
    </section>
    <section id="neue_partie" class="sections" style="display: none">
      <h1>Neue Partie</h1>
      <label for="player1" class="big-text">Spieler1</label><br />
      <input
        type="text"
        id="player1"
        class="inputs"
        autocomplete="off"
        list="favoritNames"
      /><br />
      <label for="player2" class="big-text">Spieler2</label><br />
      <input
        type="text"
        id="player2"
        class="inputs"
        autocomplete="off"
        list="favoritNames"
      /><br />
      <datalist id="favoritNames"></datalist>
      <label for="tournament" class="big-text">Turnier(optional)</label><br />
      <input
        type="text"
        id="tournament"
        class="inputs"
        autocomplete="off"
        list="tournaments"
      /><br />
      <datalist id="tournaments"></datalist>
      <label for="set" class="big-text">Satz</label><br />
      <select id="set" class="inputs">
        <option value="6">Bis 6</option>
        <option value="4">Bis 4 4-4 thiebreak</option>
        <option value="3-3">Bis 4 3-3 thiebreak</option></select
      ><br />
      <label for="max_sets" class="big-text">Sätze</label><br />
      <select id="max_sets" class="inputs">
        <option value="3">3 Sätze</option>
        <option value="5">5 Sätze</option></select
      ><br />
      <label for="3rd_set" class="big-text">letzter Satz</label><br />
      <select id="3rd_set" class="inputs">
        <option value="10">Championsthiebreak bis 10</option>
        <option value="7">Championsthiebreak bis 7</option>
        <option value="set">Normaler Satz</option></select
      ><br />
      <label for="advantage" class="big-text">Mit vorteil?</label><br />
      <select id="advantage" class="inputs">
        <option value="true">ja</option>
        <option value="false">nein</option></select
      ><br />
      <label for="beginner" class="big-text">Wer fängt an?</label><br />
      <select id="beginner" class="inputs">
        <option value="player1">Spieler1</option>
        <option value="player2">Spieler2</option></select
      ><br />
      <label for="aloowposition" class="big-text">standort</label>
      <input type="checkbox" id="aloowposition" class="check" checked />
      <button id="start_match" onclick="start_match()" class="main-button">
        partie starten
      </button>
    </section>
    <section id="freunde" class="sections" style="display: none">
      <h1>Freunde</h1>
      <div id="friendoutput"></div>
      <div class="newfriend_div" onclick="open_newfrienddiv()">
        <div
          id="loading_newfrienddiv"
          class="loader"
          style="display: none; background: transparent"
        >
          <div class="loadingcircle">
            <div id="c1" class="c"></div>
            <div id="c2" class="c"></div>
            <div id="c3" class="c"></div>
            <div id="c4" class="c"></div>
            <div id="c5" class="c"></div>
            <div id="c6" class="c"></div>
            <div id="c7" class="c"></div>
            <div id="c8" class="c"></div>
            <div id="c9" class="c"></div>
            <div id="c10" class="c"></div>
            <div id="c11" class="c"></div>
            <div id="c12" class="c"></div>
            <div id="c13" class="c"></div>
            <div id="c14" class="c"></div>
          </div>
        </div>
        <h2>suchen</h2>
        <div id="newfriend_open_div" style="display: none">
          <br />
          <input
            type="text"
            class="inputs"
            placeholder="suchen"
            id="newfriend_search"
          />
          <div id="newfriend_searchoutput"></div>
        </div>
      </div>
    </section>
    <section id="partien" class="sections" style="display: none">
      <h1>Partien</h1>
      <form
        onsubmit="
          search_match(this.querySelector('input').value);
          return false;
        "
        id="matchSearchForm"
      >
        <input type="text" class="inputs" required placeholder="suchen" />
        <button class="main-button">suchen</button>
      </form>
      <div id="matchSearchResults">
        <div class="big-matches">
          <p class="smal-text">live | 28.08. 19:22 | sabine</p>
          <div class="big-matches-points">
            <span></span><span></span> <span></span><span></span> <span></span
            ><span></span> <span></span><span></span> <span></span><span></span>
            <span></span><span></span> <span></span><span></span> <span></span>
            <span></span>
          </div>
        </div>
      </div>
    </section>
    <section id="einstellungen" class="sections" style="display: none">
      <h1 id="profilename">Profile</h1>
      <h2 class="big-text">Namensfavoriten</h2>
      <h4 class="smal-text">
        die favoriten werden dir beim erstellen einer partie als
        namensvorschläge angezeigt
      </h4>
      <form
        onsubmit="
          addfavoritName();
          return false;
        "
      >
        <input
          type="text"
          required
          placeholder="Name"
          id="favoritNameInput"
          class="inputs"
        />
        <button type="submit" class="main-button">hinzufügen</button>
      </form>
      <div id="favoritNameDiv"></div>
      <br />
      <label for="darkmode" class="big-text">design</label>
      <select id="darkmode" class="select">
        <option value="light">hell</option>
        <option value="dark">dunkel</option>
        <option value="device">gerät</option></select
      ><br /><br />
      <button
        onclick="location.href = '/passwort-aendern'"
        class="main-button"
        style="--button-color: gray"
      >
        Passwort ändern
      </button>
      <button id="logout" class="main-button" style="--button-color: gray">
        Abmelden
      </button>
      <button id="delete_user" class="main-button" style="--button-color: red">
        Konto löschen
      </button>
    </section>
    <section id="user" class="sections" style="display: none">
      <h1>user</h1>
    </section>

    <script src="/public/main.js"></script>
  </body>
</html>
