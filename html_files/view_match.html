<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Punktezähler-Match</title>
    <link
      rel="stylesheet"
      href="/public/view_match.css"
      media="screen and (min-width: 1100px)"
    />
    <link
      rel="stylesheet"
      href="/public/view_match_handy.css"
      media="screen and (max-width: 1100px)"
    />
    <link rel="icon" href="/public/image.png" type="image/x-icon" />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <section>
        <div class="points server" id="server1"></div>
        <div class="player" id="name1">alex oberhofer</div>
        <div class="points" id="_1set1">6</div>
        <div class="points" id="_2set1">5</div>
        <div class="points" id="_3set1">5</div>
        <div class="points" id="_4set1">5</div>
        <div class="points" id="_5set1">5</div>
        <div class="points games" id="game1">30</div>

        <div class="points server" id="server2">🟡</div>
        <div class="player" id="name2">paul gurschler</div>
        <div class="points" id="_1set2">3</div>
        <div class="points" id="_2set2">7</div>
        <div class="points" id="_3set2">5</div>
        <div class="points" id="_4set2">5</div>
        <div class="points" id="_5set2">5</div>
        <div class="points games" id="game2">15</div>
      </section>
      <button id="home" class="btns" onclick="location.href = '/startseite'">
        <img src="/public/home.png" alt="home" id="homeimg" />
      </button>
      <button class="btns" style="visibility: hidden"></button>
      <button
        class="tabButton"
        onclick="
          document.querySelector('.border-bottom').classList.remove('_2');
          document.getElementById('courseTab').style.display = 'block';
          document.getElementById('infoTab').style.display = 'none';
        "
      >
        spielverlauf
      </button>
      <button
        class="tabButton"
        id="infotabselector"
        onclick="
          document.querySelector('.border-bottom').classList.add('_2');
          document.getElementById('courseTab').style.display = 'none';
          document.getElementById('infoTab').style.display = 'block';
        "
      >
        info
      </button>
      <div class="border-bottom"></div>
    </header>
    <div id="loading">
      <div class="spinner"></div>
    </div>
    <div id="courseTab"><p id="course"></p></div>
    <div id="infoTab" style="display: none">
      <div id="info"></div>
      <div id="map"></div>
      <button onclick="shareMatch()" id="shareBtn">Teilen</button>
    </div>

    <script src="/public/view_match.js"></script>
  </body>
</html>
